<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagon / Shield Shape -->
  <polygon points="100,10 180,50 180,150 100,190 20,150 20,50" fill="url(#purpleGrad)" stroke="#ffffff" stroke-width="4" />
  <polygon points="100,18 172,54 172,146 100,182 28,146 28,54" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Code/App Graphic inside a Gear in center -->
  <circle cx="100" cy="80" r="34" fill="#ffffff" />
  <path d="M100,56 L100,50 M100,110 L100,104 M70,80 L64,80 M130,80 L136,80 M78.5,58.5 L74.2,54.2 M121.5,101.5 L125.8,105.8 M78.5,101.5 L74.2,105.8 M121.5,58.5 L125.8,54.2" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <circle cx="100" cy="80" r="28" fill="#6D28D9" />
  
  <!-- Code bracket symbol </> inside circle -->
  <path d="M86,72 L76,80 L86,88 M114,72 L124,80 L114,88 M104,68 L96,92" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text -->
