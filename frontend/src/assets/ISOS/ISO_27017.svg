<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagon / Shield Shape -->
  <polygon points="100,10 180,50 180,150 100,190 20,150 20,50" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="4" />
  <polygon points="100,18 172,54 172,146 100,182 28,146 28,54" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Cloud Symbol in center -->
  <path d="M100,45 C115,45 127,53 131,65 C135,63 140,62 145,62 C159,62 170,73 170,87 C170,101 159,112 145,112 L70,112 C56,112 45,101 45,87 C45,74 55,63 68,62 C71,52 81,45 100,45 Z" fill="#ffffff" />
  
  <!-- Shield overlay on cloud -->
  <path d="M100,82 L125,92 C125,110 113,122 100,128 C87,122 75,110 75,92 Z" fill="#0E7490" stroke="#ffffff" stroke-width="2" />
  
  <!-- Checkmark inside overlay -->
  <path d="M88,96 L96,104 L112,88" fill="none" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text -->
  <text x="100" y="152" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    ISO / IEC
