<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagon / Shield Shape -->
  <polygon points="100,10 180,50 180,150 100,190 20,150 20,50" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="4" />
  <polygon points="100,18 172,54 172,146 100,182 28,146 28,54" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Cloud Symbol in center -->
  <path d="M100,45 C115,45 127,53 131,65 C135,63 140,62 145,62 C159,62 170,73 170,87 C170,101 159,112 145,112 L70,112 C56,112 45,101 45,87 C45,74 55,63 68,62 C71,52 81,45 100,45 Z" fill="#ffffff" />
  
  <!-- Padlock Symbol overlay on cloud -->
  <rect x="84" y="86" width="32" height="24" rx="4" fill="#047857" stroke="#ffffff" stroke-width="2" />
  <path d="M90,86 L90,78 C90,72 94,68 100,68 C106,68 110,72 110,78 L110,86" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  
  <!-- Keyhole in padlock -->
  <circle cx="100" cy="94" r="2.5" fill="#ffffff" />
  <polygon points="98.5,95 101.5,95 102.5,103 97.5,103" fill="#ffffff" />

  <!-- Text -->
  <text x="100" y="152" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    ISO / IEC
  </text>
  <text x="100" y="174" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#A7F3D0" text-anchor="middle" letter-spacing="1.5">
    27018
  </text>
</svg>