<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4D955" />
      <stop offset="100%" stop-color="#4881EB" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagon / Shield Shape -->
  <polygon points="100,10 180,50 180,150 100,190 20,150 20,50" fill="url(#aiGrad)" stroke="#ffffff" stroke-width="4" />
  <polygon points="100,18 172,54 172,146 100,182 28,146 28,54" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Brain / AI Neural Network in center -->
  <circle cx="100" cy="80" r="34" fill="#ffffff" />
  <circle cx="100" cy="80" r="28" fill="#4881EB" />
  
  <!-- Neural Network Connections -->
  <path d="M86,80 L100,68 L114,80 L100,92 L86,80 Z M100,68 L100,92 M86,80 L114,80" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <!-- Nodes -->
  <circle cx="100" cy="68" r="4.5" fill="#A4D955" stroke="#ffffff" stroke-width="1" />
  <circle cx="100" cy="92" r="4.5" fill="#A4D955" stroke="#ffffff" stroke-width="1" />
  <circle cx="86" cy="80" r="4.5" fill="#A4D955" stroke="#ffffff" stroke-width="1" />
  <circle cx="114" cy="80" r="4.5" fill="#A4D955" stroke="#ffffff" stroke-width="1" />
  <circle cx="100" cy="80" r="3" fill="#ffffff" />

  <!-- Text -->
  <text x="100" y="152" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    ISO / IEC
  </text>
  <text x="100" y="174" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#E0F2FE" text-anchor="middle" letter-spacing="1.5">
    42001
  </text>
</svg>