<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagon / Shield Shape -->
  <polygon points="100,10 180,50 180,150 100,190 20,150 20,50" fill="url(#redGrad)" stroke="#ffffff" stroke-width="4" />
  <polygon points="100,18 172,54 172,146 100,182 28,146 28,54" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Scales of Justice Symbol in center -->
  <circle cx="100" cy="80" r="34" fill="#ffffff" />
  <circle cx="100" cy="80" r="28" fill="#991B1B" />
  
  <!-- Scale Graphics -->
  <path d="M100,60 L100,94 M88,94 L112,94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M82,68 L118,68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left Pan -->
  <path d="M82,68 L74,84 L90,84 Z" fill="#ffffff" />
  <!-- Right Pan -->
  <path d="M118,68 L110,84 L126,84 Z" fill="#ffffff" />

  <!-- Text -->
  <text x="100" y="152" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    ISO
  </text>
  <text x="100" y="174" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#FECACA" text-anchor="middle" letter-spacing="1.5">
    37001
  </text>
</svg>