<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e3a5a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <linearGradient id="cyanMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#000000"/>
  <circle cx="200" cy="200" r="180" fill="url(#cyanGlow)"/>

  <g transform="translate(0, 0)" filter="url(#softGlow)">
    <!-- Interoperability Connected Node Rings -->
    <circle cx="200" cy="200" r="100" fill="none" stroke="url(#cyanMetal)" stroke-width="4" opacity="0.3"/>
    <circle cx="200" cy="200" r="65" fill="none" stroke="#7dd3fc" stroke-width="6" opacity="0.7"/>
    
    <!-- Central Robotic Physical Joint Sphere -->
    <circle cx="200" cy="200" r="32" fill="url(#cyanMetal)"/>
    <circle cx="200" cy="200" r="18" fill="#e0f2fe" opacity="0.9"/>
    
    <!-- Physical Node Connections (Robotic Arms) -->
    <line x1="200" y1="100" x2="200" y2="135" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="265" x2="200" y2="300" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="200" x2="135" y2="200" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="265" y1="200" x2="300" y2="200" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    
    <circle cx="200" cy="100" r="10" fill="#38bdf8"/>
    <circle cx="200" cy="300" r="10" fill="#38bdf8"/>
    <circle cx="100" cy="200" r="10" fill="#38bdf8"/>
    <circle cx="300" cy="200" r="10" fill="#38bdf8"/>
  </g>
</svg>
