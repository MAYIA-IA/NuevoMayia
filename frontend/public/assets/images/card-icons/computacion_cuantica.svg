<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    
    <filter id="quantumBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <linearGradient id="quantumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#000000"/>
  <circle cx="200" cy="200" r="180" fill="url(#purpleGlow)"/>

  <g filter="url(#quantumBlur)">
    <!-- Quantum Orbital Ring 1 -->
    <ellipse cx="200" cy="200" rx="120" ry="40" fill="none" stroke="url(#quantumGradient)" stroke-width="4" transform="rotate(-30 200 200)"/>
    <!-- Quantum Orbital Ring 2 -->
    <ellipse cx="200" cy="200" rx="120" ry="40" fill="none" stroke="#e9d5ff" stroke-width="3" opacity="0.75" transform="rotate(30 200 200)"/>
    <!-- Quantum Orbital Ring 3 -->
    <ellipse cx="200" cy="200" rx="120" ry="40" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.5" transform="rotate(90 200 200)"/>

    <!-- Central Qubit Sphere -->
    <circle cx="200" cy="200" r="28" fill="url(#quantumGradient)"/>
    <circle cx="200" cy="200" r="14" fill="#f3e8ff"/>
    
    <!-- Satellite Qubits -->
    <circle cx="100" cy="140" r="7" fill="#c084fc"/>
    <circle cx="300" cy="260" r="7" fill="#c084fc"/>
    <circle cx="260" cy="110" r="7" fill="#e9d5ff"/>
    <circle cx="140" cy="290" r="7" fill="#e9d5ff"/>
  </g>
</svg>
