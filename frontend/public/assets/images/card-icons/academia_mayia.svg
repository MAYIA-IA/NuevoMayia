<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1f10" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Gold Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 3D Cap Gradient -->
    <linearGradient id="capGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- 3D Glass Surface -->
    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Pure Black Canvas with Center Ambient Warmth -->
  <rect width="400" height="400" fill="#000000"/>
  <circle cx="200" cy="200" r="180" fill="url(#bgGlow)"/>

  <g transform="translate(0, 10)" filter="url(#glow)">
    <!-- Knowledge Orbital Ring -->
    <ellipse cx="200" cy="240" rx="110" ry="35" fill="none" stroke="url(#capGold)" stroke-width="4" opacity="0.4"/>
    <ellipse cx="200" cy="240" rx="90" ry="28" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.2"/>

    <!-- 3D Minimalist Mortarboard Top Facet -->
    <polygon points="200,105 310,155 200,205 90,155" fill="url(#glassFacet)"/>
    <polygon points="200,105 310,155 200,205 90,155" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.8"/>

    <!-- Cap Base Underside 3D Geometry -->
    <polygon points="145,180 255,180 255,215 145,215" fill="url(#capGold)" opacity="0.85"/>
    <path d="M145,180 Q200,230 255,180 L255,210 Q200,260 145,210 Z" fill="url(#capGold)"/>

    <!-- Soft Tassel Accent -->
    <path d="M310,155 Q320,185 305,230" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="305" cy="233" r="5" fill="#fef08a"/>
  </g>
</svg>
